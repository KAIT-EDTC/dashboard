version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 公開直後の版は避ける（乗っ取られたパッケージを掴まないため）
    cooldown:
      default-days: 7
    ignore:
      # 実行環境の Node 22 に型を合わせる
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint が TS 7 に未対応。対応したら外す
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      # 本体と dev ツールの版がずれると壊れるので、major も含めて必ず一緒に上げる
      react-router:
        patterns: ["react-router", "@react-router/*"]
      # 本体とプリセットの版を揃える必要がある
      pandacss:
        patterns: ["@pandacss/*"]
      # minor / patch は週1本のPRにまとめる。それ以外の major は1件ずつ別PRで来る
      minor-and-patch:
        update-types: [minor, patch]
        # 両方の group に当てはまると minor-and-patch 側に取られるので外す
        exclude-patterns: ["react-router", "@react-router/*", "@pandacss/*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
