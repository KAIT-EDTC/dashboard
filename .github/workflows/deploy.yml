name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同時に複数のデプロイ（特にD1マイグレーション）が走らないよう直列化する
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # スキーマ変更を先に適用してからWorkerを差し替える（未適用のマイグレーションが無ければ何もしない）
      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Deploy
        run: npm run deploy -w server
