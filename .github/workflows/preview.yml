name: Preview

# PRごとに、そのPRのコードで動くプレビュー環境を作る（PRを閉じたら消す）
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: f63f9ebc5db7b049a6e98a155a3d219d
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
  DB_NAME: edtc-dashboard-pr-${{ github.event.pull_request.number }}

jobs:
  deploy:
    # fork と Dependabot のPRには secret が渡らないので作らない（pull_request_target は使わない）
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: preview
      url: ${{ steps.url.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - id: url
        name: Resolve preview URL
        # アカウントの workers.dev サブドメインはAPIで引く（URLを設定ファイルに書かずに済む）
        run: |
          sub=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -er .result.subdomain)
          echo "url=https://$PREVIEW_NAME-edtc-dashboard-preview.$sub.workers.dev" >> "$GITHUB_OUTPUT"

      # マイグレーションはPRの途中で書き換わることがあるので、毎回まっさらなD1から作る
      - name: Recreate D1
        working-directory: server
        run: |
          npx wrangler d1 delete "$DB_NAME" -y || true
          npx wrangler d1 create "$DB_NAME"
          sed -i "s/PREVIEW_DB_ID/$(npx wrangler d1 info "$DB_NAME" --json | jq -er .uuid)/g" wrangler.jsonc
          npx wrangler d1 migrations apply DB --remote --env preview
          npx wrangler d1 execute DB --remote --env preview --file seed/seed.sql

      # JWT_SECRET はデプロイごとに使い捨て（保存しておく secret を増やさない）
      - name: Deploy Preview
        working-directory: server
        run: |
          echo "{\"JWT_SECRET\":\"$(openssl rand -hex 32)\"}" > "$RUNNER_TEMP/secrets.json"
          npx wrangler preview --env preview --name "$PREVIEW_NAME" \
            --var "FRONTEND_URL:${{ steps.url.outputs.url }}" --secrets-file "$RUNNER_TEMP/secrets.json"

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Delete Preview and D1
        working-directory: server
        run: |
          npx wrangler preview delete --env preview --name "$PREVIEW_NAME" -y
          npx wrangler d1 delete "$DB_NAME" -y
